function renderBase(){if(!state)return;const t=T(),s=state,n=s.modo==='ia'?[t.names[0],$('lang').value==='pl'?'AI 1':'IA 1',$('lang').value==='pl'?'AI 2':'IA 2']:t.names,terminal=['fin','fin_mano'].includes(s.fase);document.documentElement.lang=$('lang').value;$('new').textContent=t.new;$('targetTop').textContent=t.target+' '+s.objetivo;$('modeNote').textContent=t.mode;$('scoreTitle').textContent=t.score;$('nameHead').textContent=t.name;$('pointsHead').textContent=t.points;$('tricksHead').textContent=t.tricks;$('rules').textContent=t.rules;$('prototypeNote').textContent=t.note;const phase={licitacion:t.bidPhase,reparto:t.giftPhase,contrato:t.contractPhase,juego:t.playPhase,fin_mano:t.endHand,fin:t.end}[s.fase];$('phase').textContent=phase+(s.turno!==null?' · '+t.turn+' '+n[s.turno]:'');$('legend').textContent=t.contractLabel+': '+(s.contrato||'—')+' · '+t.trump+': '+(s.atu?suits[s.atu]:t.none);for(let k=1;k<=2;k++){let j=(viewer+k)%3;$('opp'+k).textContent=n[j]+(s.turno===j?' ◀':'');$('backs'+k).replaceChildren();for(let a=0;a<s.cantidades[j];a++){let b=document.createElement('span');b.className='back';$('backs'+k).append(b)}}$('scores').replaceChildren();for(let j=0;j<3;j++){const tr=document.createElement('tr');if(s.turno===j)tr.className='active';for(const x of [n[j],s.totales[j],s.bazas.filter(b=>b.ganador===j).length]){let td=document.createElement('td');td.textContent=x;tr.append(td)}$('scores').append(tr)}$('meta').replaceChildren();const mt=document.createElement('p');mt.className='metaTitle';mt.textContent=$('lang').value==='pl'?'To rozdanie':'Esta mano';$('meta').append(mt);for(const [a,b]of [[t.bidder,s.declarante===null?'—':n[s.declarante]],[t.contractLabel,s.contrato||s.puja],[t.tricks,s.bazas.length+'/8'],[t.trump,s.atu?suits[s.atu]:'—'],[t.hand,s.numero_mano],[t.target,s.objetivo]]){let row=document.createElement('p'),label=document.createElement('span'),value=document.createElement('b');label.textContent=a;value.textContent=b;row.append(label,value);$('meta').append(row)}$('scoreFoot').textContent=s.resultado?t.result+': '+s.resultado.variacion.map((v,j)=>n[j]+' '+(v>=0?'+':'')+v).join(' · '):'';$('tricks').replaceChildren();let active=s.baza.length?s.baza:null,last=!active&&s.bazas.length?s.bazas.at(-1):null;if(['reparto','contrato'].includes(s.fase)){for(const c of s.musik_publico){const el=document.createElement('div');el.className='slot';el.append(card(c));$('tricks').append(el)}$('legend').textContent=t.musik;}else{for(let j=0;j<3;j++){let slot=document.createElement('div');slot.className='slot';let label=document.createElement('span');label.textContent=n[j];const c=(active||last?.cartas||[]).find(x=>x[0]===j)?.[1];slot.append(label);if(c){let el=card(c);if(last)el.classList.add('waiting');slot.append(el)}else{let el=document.createElement('div');el.className='card empty';slot.append(el)}$('tricks').append(slot)}if(last)$('legend').textContent=t.last+' · '+n[last.ganador]+' +'+last.puntos;}
$('hand').replaceChildren();$('handLabel').textContent=n[viewer]+' · '+t.yourhand;$('veil').classList.toggle('hidden',open||terminal);$('veilTitle').textContent=t.passDevice+' '+n[s.turno??viewer];$('veilText').textContent=t.private;$('reveal').textContent=t.reveal;$('controls').replaceChildren();$('hint').textContent='';if(!open&&!terminal)return;
if(!terminal){const orden={'H':0,'D':1,'C':2,'S':3},ranks=['9','J','Q','K','10','A'];const mano=[...s.mano].sort((a,b)=>orden[a[0]]-orden[b[0]]||ranks.indexOf(a.slice(1))-ranks.indexOf(b.slice(1)));for(const c of mano){const e=card(c,true);e.disabled=busy||s.modo==='ia'&&s.turno!==0||s.fase==='juego'&&!s.legales.includes(c);e.classList.toggle('selected',selected.includes(c));e.setAttribute('aria-pressed',selected.includes(c));if(s.fase==='reparto'&&selected.includes(c)){const tag=document.createElement('span');tag.className='gift';tag.textContent='→ '+n[(viewer+1+selected.indexOf(c))%3];e.append(tag)}e.onclick=()=>{if(s.fase==='reparto'){selected=selected.includes(c)?selected.filter(x=>x!==c):selected.length<2?[...selected,c]:[selected[1],c]}else selected=selected.includes(c)?[]:[c];meld=false;render()};$('hand').append(e)}}
if(s.modo==='ia'&&s.turno!==0&&!terminal){$('hint').textContent=($('lang').value==='pl'?'Przeciwnik wybiera ruch…':'El rival está pensando su jugada…');return;}
if(s.fase==='licitacion'){number('bidValue',s.puja+10,s.puja_maxima_propia,s.puja+10);button('bid',t.bid,()=>act({tipo:'licitar',cantidad:Number($('bidValue').value)}),s.puja+10>s.puja_maxima_propia);button('pass',t.pass,()=>act({tipo:'licitar',cantidad:null}));$('hint').textContent=t.auctionHelp;}
if(s.fase==='reparto'){$('hint').textContent=t.giftHelp.replace('{a}',n[(viewer+1)%3]).replace('{b}',n[(viewer+2)%3]);button('giftConfirm',t.gift,()=>act({tipo:'repartir',entregas:{[(viewer+1)%3]:selected[0],[(viewer+2)%3]:selected[1]}}),selected.length!==2)}
if(s.fase==='contrato'){number('contractValue',s.puja,Math.max(s.puja,s.puja_maxima_propia),s.puja);button('contract',t.contract,()=>act({tipo:'contrato',cantidad:Number($('contractValue').value)}));$('hint').textContent=t.contractHelp}
if(s.fase==='juego'){$('hint').textContent=t.playHelp;if(selected.length&&s.declarables.includes(selected[0])){const lab=document.createElement('label');lab.id='meldLabel';const inp=document.createElement('input');inp.type='checkbox';inp.id='meld';inp.checked=meld;inp.onchange=()=>meld=inp.checked;lab.append(inp,document.createTextNode(t.meld+' +'+s.meld_valores[selected[0][0]]));$('controls').append(lab)}button('play',t.play,()=>act({tipo:'jugar',carta:selected[0],declarar:meld}),selected.length!==1)}
if(['reparto','contrato'].includes(s.fase))button('bomb',t.bomb,()=>{if(confirm(t.bombConfirm))act({tipo:'bomba'})});if(s.puede_reparto)button('redeal',t.redeal,()=>act({tipo:'reparto'}));if(s.fase==='fin_mano'){button('next',t.next,()=>act({tipo:'siguiente'}));$('hint').textContent=t.endHand}else if(s.fase==='fin')$('hint').textContent=t.won+': '+s.ganadores.map(j=>n[j]).join(', ');
}
$('reveal').onclick=async()=>{try{await load(state.turno??viewer);open=true;render()}catch(e){$('error').textContent=e.message}};$('new').onclick=()=>{if(confirm(T().newConfirm))act({tipo:'nueva'})};$('help').onclick=()=>$('helpDialog').showModal();$('closeHelp').onclick=()=>$('helpDialog').close();$('lang').onchange=render;load(0).catch(e=>$('error').textContent=e.message);
function fitScene(){const h=document.querySelector('header').getBoundingClientRect().height;const scale=Math.min(innerWidth/1672,(innerHeight-h)/941);document.documentElement.style.setProperty('--scene-scale',scale);document.querySelector('main').style.top=(h+(innerHeight-h-941*scale)/2)+'px'}window.addEventListener('resize',fitScene);fitScene();let botTimer=null;
function render(){
 if(!state)return;
 const ai=state.modo==='ia',pl=$('lang').value==='pl';
 $('mode').value=ai?(state.nivel==='normal'?'ia':'ia_'+state.nivel):'local';
 for(const [value,es,pol] of [['ia','Contra 2 IA: normal','Przeciw 2 AI: normalny'],['ia_facil','Contra 2 IA: f\u00e1cil','Przeciw 2 AI: \u0142atwy'],['ia_dificil','Contra 2 IA: dif\u00edcil','Przeciw 2 AI: trudny'],['local','Tres jugadores locales','Trzech graczy lokalnie']])document.querySelector('#mode option[value="'+value+'"]').textContent=pl?pol:es;
 if(ai){viewer=0;open=true;}
 renderBase();
 $('prototypeNote').textContent=pl?'Prototyp lokalny. AI widzi tylko własne karty i informacje publiczne. Grafika kart jest tymczasowa. W trybie lokalnym przekazuj urządzenie i odkrywaj tylko własną rękę.':'Maqueta local. La IA solo conoce su mano y la información pública. Las cartas siguen siendo provisionales. En el modo local, pasa el dispositivo y revela solo tu mano.';
 if(botTimer){clearTimeout(botTimer);botTimer=null}
 if(ai&&state.turno!==null&&state.turno!==0&&!busy){botTimer=setTimeout(()=>act({tipo:'bot'}),state.espera_ia_ms||800)}
}
$('mode').onchange=()=>{const next=$('mode').value;if(confirm($('lang').value==='pl'?'Zmiana trybu rozpocznie nową grę. Kontynuować?':'Cambiar de modo inicia una partida nueva. ¿Continuar?'))act({tipo:'config',modo:next==='local'?'local':'ia',nivel:next==='ia_facil'?'facil':next==='ia_dificil'?'dificil':'normal'});else render();};
window.addEventListener('pagehide',()=>{if(botTimer)clearTimeout(botTimer)});
</script></html>
